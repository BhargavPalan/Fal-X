# Local development database.
#
# This is for development only. A deployment uses whatever Postgres the
# operator already runs, reached through FALX_DSN.
#
# Row-level security never applies to a superuser or a BYPASSRLS role, and the
# postgres image creates POSTGRES_USER as a SUPERUSER. So initdb/01-no-superuser.sql
# downgrades the application role to NOSUPERUSER NOBYPASSRLS the moment the database
# is initialised; otherwise a convenient role would quietly disable the tenant
# isolation the whole design rests on. (Migrations set FORCE row-level security, so
# the role staying the schema owner does not reopen the hole.)

services:
  postgres:
    image: postgres:16-alpine
    container_name: falx-postgres
    environment:
      POSTGRES_DB: falx
      POSTGRES_USER: falx
      POSTGRES_PASSWORD: falx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - falx-pgdata:/var/lib/postgresql/data
      # Runs once on an empty data directory, after the role and database exist.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falx -d falx"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  falx-pgdata: